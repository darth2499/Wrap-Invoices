# Uploads the server functions (supabase/functions) to Supabase.
# Runs when you change anything in supabase/functions (or the invoice-PDF code it shares with the app), or by hand from the Actions tab.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', 'src/lib/pdf.js', 'src/lib/format.js', 'src/lib/calc.js', 'src/lib/emailTemplate.js', 'src/lib/logos.js', 'src/lib/match.js', 'src/lib/dateText.js', 'src/lib/scanRules.js', 'scripts/sync-shared.mjs']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Copy the invoice-PDF code into the functions
        run: node scripts/sync-shared.mjs
      - name: Deploy functions
        run: |
          for fn in files receipt-read public gmail reminders people; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
