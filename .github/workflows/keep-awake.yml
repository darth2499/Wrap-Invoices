# Free Supabase projects pause after a week with no activity. This pings yours once a day.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/functions/v1/public" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -d '{"action":"ping"}'
